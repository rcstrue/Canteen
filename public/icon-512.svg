<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="flame" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Subtle inner glow ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.15"/>
  <!-- Flame body -->
  <g filter="url(#shadow)">
    <path d="M 256 120
             C 200 180, 170 220, 170 280
             C 170 340, 210 390, 256 390
             C 302 390, 342 340, 342 280
             C 342 240, 322 220, 310 200
             C 305 230, 290 240, 280 240
             C 290 200, 280 160, 256 120 Z"
          fill="url(#flame)"/>
    <!-- Inner flame -->
    <path d="M 256 220
             C 230 250, 220 280, 220 310
             C 220 340, 235 360, 256 360
             C 277 360, 292 340, 292 310
             C 292 290, 282 280, 278 270
             C 275 285, 268 290, 262 290
             C 268 270, 264 245, 256 220 Z"
          fill="#fef3c7" opacity="0.85"/>
  </g>
  <!-- RCS text at bottom -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="6">RCS</text>
</svg>
